<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinh phục Toán 12 Nâng cao - DoforMath</title>
    
    <!-- Cấu hình Favicon -->
    <link rel="icon" type="image/png" href="../assets/images/Doformath.png">

    <!-- Font chữ Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS và cấu hình màu Teal chủ đạo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { primary: '#0d9488', secondary: '#facc15'} } }
        }
    </script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- KaTeX cho Toán học -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <!-- Thư viện PDF.js cốt lõi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        // Cài đặt worker cho PDF.js hoạt động trơn tru
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
</head>
<body class="bg-gray-50 text-gray-800 antialiased font-sans">

    <!-- Header Navigation -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="../index.html" class="flex items-center text-gray-500 hover:text-primary font-medium gap-2 transition">
                <i class="fa-solid fa-arrow-left"></i> Trở về Trang chủ
            </a>
            <div class="hidden sm:block hover:opacity-80 transition-opacity cursor-pointer">
                <span class="text-2xl tracking-tight text-gray-900 pb-1">
                    $\textcolor{#0d9488}{\textsf{\textbf{Dofor}}{\sum}\textsf{\textbf{ath}}}$
                </span>
            </div>
        </div>
    </header>

    <!-- Khu vực Tiêu đề -->
    <div class="max-w-4xl mx-auto px-4 w-full mt-8 mb-6">
        <div class="bg-gradient-to-r from-blue-50 to-teal-50 border border-blue-100 rounded-2xl p-6 shadow-sm flex flex-col items-center text-center">
            <span class="bg-blue-100 text-blue-700 border border-blue-200 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wide mb-3 shadow-sm inline-flex items-center gap-1.5">
                <i class="fa-regular fa-file-pdf"></i> Tài liệu PDF
            </span>
            <h1 id="doc-title" class="text-2xl md:text-3xl font-bold text-gray-900 leading-snug">Đang tải tên bài học...</h1>
            <div class="w-16 h-1 bg-gradient-to-r from-blue-400 to-teal-400 rounded-full mt-4"></div>
        </div>
    </div>

    <!-- Khung chứa bản vẽ PDF (Chống click chuột phải) -->
    <main class="flex-1 w-full max-w-4xl mx-auto px-4 pb-12 select-none" oncontextmenu="return false;">
        <div id="pdf-container" class="w-full bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col items-center p-2 md:p-8 relative min-h-[500px]">
            <!-- Vòng xoay tải trang -->
            <div id="loader" class="absolute top-20 text-gray-400 flex flex-col items-center gap-2">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl"></i>
                <span class="text-sm">Đang giải mã và vẽ tài liệu...</span>
            </div>
        </div>
    </main>

    <!-- Script Tự động hóa vẽ PDF -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Lấy thông tin từ thanh địa chỉ URL
            const urlParams = new URLSearchParams(window.location.search);
            const fileName = urlParams.get('file'); // Ví dụ: vach-ngan-nang-cao.pdf
            const title = urlParams.get('title');

            if (title) {
                document.getElementById('doc-title').innerText = title;
                document.title = title + " - DoforMath";
            }

            const container = document.getElementById('pdf-container');
            const loader = document.getElementById('loader');

            if (!fileName) {
                loader.innerHTML = "Lỗi: Không tìm thấy file tài liệu! Vui lòng kiểm tra đường link.";
                return;
            }

            // Đường dẫn đến thư mục chứa file PDF của bạn
            // Bạn có thể đổi thành link Cloudinary nếu đẩy PDF lên mây
            const pdfUrl = `../assets/documents/${fileName}`;

            // Hàm xử lý PDF
            pdfjsLib.getDocument(pdfUrl).promise.then(pdf => {
                loader.style.display = 'none'; // Tắt vòng xoay khi tìm thấy file
                
                let currPage = 1;
                const numPages = pdf.numPages;

                // Dùng hàm đệ quy để vẽ lần lượt từng trang, tránh tình trạng trang 3 tải xong trước trang 1
                function renderNextPage() {
                    if (currPage > numPages) return; // Đã vẽ hết các trang

                    pdf.getPage(currPage).then(page => {
                        // Tạo một bức tranh canvas (mỗi trang là 1 bức tranh)
                        const canvas = document.createElement('canvas');
                        
                        // Lớp bảo vệ: pointer-events-none chặn mọi thao tác chuột (kéo, thả, nhấp) lên bức tranh
                        canvas.className = "w-full h-auto block mb-6 shadow-md border border-gray-200 pointer-events-none rounded-lg";
                        const ctx = canvas.getContext('2d');
                        
                        // Mấu chốt độ nét: Scale = 2.0 (Vẽ to gấp đôi để khi thu nhỏ vừa màn hình sẽ cực kỳ sắc nét)
                        const scale = 2.0; 
                        const viewport = page.getViewport({ scale: scale });
                        
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;
                        
                        const renderContext = {
                            canvasContext: ctx,
                            viewport: viewport
                        };
                        
                        page.render(renderContext).promise.then(() => {
                            container.appendChild(canvas);
                            currPage++;
                            renderNextPage(); // Vẽ xong trang này thì gọi vẽ tiếp trang sau
                        });
                    });
                }
                
                // Kích hoạt vẽ trang đầu tiên
                renderNextPage();

            }).catch(error => {
                loader.innerHTML = "Lỗi tải PDF. Vui lòng kiểm tra lại tên file hoặc đường dẫn.";
                console.error(error);
            });
        });
    </script>
    
    <!-- Script Kích hoạt KaTeX cho Logo -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            renderMathInElement(document.body, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false}
                ],
                throwOnError : false
            });
        });
    </script>

</body>
</html>
