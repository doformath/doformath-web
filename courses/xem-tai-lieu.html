    <!-- Script Tải ảnh song song theo POOL (Concurrency Pool) -->
    <script>
        // Chạy NGAY LẬP TỨC, không chờ DOMContentLoaded.
        (function () {
            const urlParams = new URLSearchParams(window.location.search);
            const folderName = urlParams.get('folder');
            const title = urlParams.get('title');

            if (title) {
                document.getElementById('doc-title').innerText = title;
                document.title = title + " - DoforMath";
            }

            const container = document.getElementById('image-container');
            const loader = document.getElementById('loader');
            const cloudName = "vrhp60zs";

            if (!folderName) {
                loader.innerHTML = "<span class='text-red-500 font-bold'>Lỗi: Không tìm thấy thư mục tài liệu!</span>";
                return;
            }

            const CONCURRENCY = 8;  // Số ảnh tải song song CÙNG LÚC (pool), thay vì
                                     // chờ hết cả lô 6 ảnh chậm nhất mới mở lô tiếp theo.
            const MAX_PAGES = 300;  // Giới hạn an toàn, tránh vòng lặp chạy vô hạn khi có lỗi

            // TỐI ƯU #2 — ĐỘ NÉT: thêm dpr_auto để Cloudinary tự trả ảnh có mật độ
            // điểm ảnh khớp với devicePixelRatio của máy (màn Retina/2x, 3x sẽ
            // nhận ảnh nét hơn thay vì bị phóng to từ 1x và mờ đi). Nâng độ rộng
            // giới hạn lên 2200px và dùng q_auto:good để giữ chi tiết chữ/số nhỏ
            // trong tài liệu Toán rõ hơn so với q_auto mặc định.
            function buildUrl(page) {
                return `https://res.cloudinary.com/${cloudName}/image/upload/f_auto,q_auto:good,dpr_auto,c_limit,w_2200/${folderName}-${page}.png`;
            }

            function probeImage(page, allowRetry = true) {
                return new Promise((resolve) => {
                    const img = new Image();
                    img.decoding = "async";
                    img.onload = () => resolve({ page, ok: true, img });
                    img.onerror = () => {
                        if (allowRetry) {
                            probeImage(page, false).then(resolve);
                        } else {
                            resolve({ page, ok: false });
                        }
                    };
                    img.src = buildUrl(page);
                });
            }

            function appendImage(page, img) {
                img.loading = page <= 2 ? "eager" : "lazy";
                if (page <= 2) img.fetchPriority = "high";
                img.className = "w-full h-auto block mb-6 shadow-sm border border-gray-100 pointer-events-none";
                img.alt = `Trang ${page}`;
                container.appendChild(img);
            }

            // TỐI ƯU #3 — TỐC ĐỘ: thay cơ chế "tải lô 6 ảnh rồi CHỜ CẢ LÔ xong mới
            // mở lô tiếp theo" bằng một pool 8 worker chạy song song liên tục —
            // hễ 1 ảnh tải xong là worker đó lập tức xin trang kế tiếp, không phải
            // chờ ảnh chậm nhất trong lô. Vì các worker hoàn thành không theo đúng
            // thứ tự trang, kết quả được gom vào hàng đợi và chèn vào DOM đúng thứ
            // tự trang (1, 2, 3, …) để người đọc không thấy trang bị đảo lộn.
            async function loadAllPages() {
                let nextPageToFetch = 1;
                let firstMissingPage = Infinity;
                let loadedCount = 0;
                let nextPageToInsert = 1;
                const pending = new Map(); // page -> img, chờ tới lượt chèn vào DOM

                function flushInOrder() {
                    while (pending.has(nextPageToInsert) && nextPageToInsert < firstMissingPage) {
                        const img = pending.get(nextPageToInsert);
                        pending.delete(nextPageToInsert);
                        appendImage(nextPageToInsert, img);
                        loadedCount++;
                        if (loadedCount === 1) loader.style.display = 'none';
                        nextPageToInsert++;
                    }
                }

                async function worker() {
                    while (true) {
                        if (nextPageToFetch > MAX_PAGES || nextPageToFetch >= firstMissingPage) return;
                        const page = nextPageToFetch++;
                        const result = await probeImage(page);
                        if (result.ok) {
                            pending.set(page, result.img);
                            flushInOrder();
                        } else if (page < firstMissingPage) {
                            firstMissingPage = page;
                        }
                    }
                }

                await Promise.all(Array.from({ length: CONCURRENCY }, worker));

                if (loadedCount === 0) {
                    loader.innerHTML = "<span class='text-red-500'>Không tìm thấy tài liệu trên hệ thống.</span>";
                }
            }

            loadAllPages();

            // TỐI ƯU #4 — chỉ nạp KaTeX (2 request JS + CSS đã có sẵn ở <head>)
            // khi tiêu đề THỰC SỰ chứa công thức Toán (ký hiệu $...$). Nhiều tài
            // liệu có tiêu đề thuần văn bản thì không cần tải/parse KaTeX chút nào.
            const needsKatex = !!(title && title.indexOf('$') !== -1);
            if (needsKatex) {
                const s1 = document.createElement('script');
                s1.src = "https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js";
                s1.onload = function () {
                    const s2 = document.createElement('script');
                    s2.src = "https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js";
                    s2.onload = renderKatexTargets;
                    document.head.appendChild(s2);
                };
                document.head.appendChild(s1);
            }

            function renderKatexTargets() {
                const targets = [document.getElementById('logo-math'), document.getElementById('title-section')];
                targets.forEach(el => {
                    if (el && window.renderMathInElement) {
                        renderMathInElement(el, {
                            delimiters: [
                                { left: '$$', right: '$$', display: true },
                                { left: '$', right: '$', display: false }
                            ],
                            throwOnError: false
                        });
                    }
                });
            }
        })();
    </script>

    <!-- Script Xử lý chức năng Zoom -->
    <script>
        let currentZoom = 80;

        document.addEventListener("DOMContentLoaded", function() {
            applyZoom();
        });

        window.addEventListener('resize', applyZoom);

        function zoomIn() {
            if (currentZoom < 150) {
                currentZoom += 10;
                applyZoom();
            }
        }

        function zoomOut() {
            if (currentZoom > 50) {
                currentZoom -= 10;
                applyZoom();
            }
        }

        function applyZoom() {
            document.getElementById('zoom-level').innerText = currentZoom + '%';
            const container = document.getElementById('image-container');

            if (window.innerWidth < 768) {
                container.style.width = '100%';
            } else {
                container.style.width = currentZoom + '%';
            }
            container.style.margin = '0 auto';
        }
    </script>
</body>
</html>
