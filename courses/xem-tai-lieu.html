<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinh phục Toán 12 Nâng cao - DoforMath</title>
    
    <!-- Cấu hình Favicon -->
    <link rel="icon" type="image/png" href="../assets/images/Doformath.png">

    <!-- Font chữ Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS và cấu hình màu Teal chủ đạo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { primary: '#0d9488', secondary: '#facc15'} } }
        }
    </script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- KaTeX cho Toán học -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 antialiased font-sans">

    <!-- Header Navigation -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <!-- Nút quay lại trang trước -->
<a href="javascript:history.back()" class="flex items-center text-gray-500 hover:text-primary font-medium gap-2 transition">
    <i class="fa-solid fa-arrow-left"></i> Quay lại
</a>
            
            <!-- Logo Toán học -->
            <div class="hidden sm:block hover:opacity-80 transition-opacity cursor-pointer">
                <span class="text-2xl tracking-tight text-gray-900 pb-1">
                    $\textcolor{#0d9488}{\textsf{\textbf{Dofor}}{\sum}\textsf{\textbf{ath}}}$
                </span>
            </div>
        </div>
    </header>

    <!-- Khu vực Tiêu đề động được thiết kế lại thành khối Banner -->
    <div class="max-w-4xl mx-auto px-4 w-full mt-8 mb-6">
        <div class="bg-gradient-to-r from-blue-50 to-teal-50 border border-blue-100 rounded-2xl p-6 shadow-sm flex flex-col items-center text-center">
            
            <!-- Badge (Nhãn) có thêm icon -->
            <span class="bg-blue-100 text-blue-700 border border-blue-200 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wide mb-3 shadow-sm inline-flex items-center gap-1.5">
                <i class="fa-regular fa-folder-open"></i> Tài liệu học tập
            </span>
            
            <!-- Tên bài học (Javascript sẽ tự động điền vào đây) -->
            <h1 id="doc-title" class="text-2xl md:text-3xl font-bold text-gray-900 leading-snug">Đang tải tên bài học...</h1>
            
            <!-- Dòng kẻ gạch chân trang trí -->
            <div class="w-16 h-1 bg-gradient-to-r from-blue-400 to-teal-400 rounded-full mt-4"></div>
            
        </div>
    </div>
    <!-- Khu vực Tiêu đề động được thiết kế lại thành khối Banner -->
    <div class="max-w-4xl mx-auto px-4 w-full mt-8 mb-4">
        <!-- ... (Khối banner tiêu đề hiện tại của bạn giữ nguyên) ... -->
    </div>

    <!-- THANH CÔNG CỤ ZOOM (Cố định khi cuộn) -->
    <div class="max-w-7xl mx-auto px-4 flex justify-end mb-4 sticky top-[90px] z-40">
        <div class="bg-white/90 backdrop-blur-md border border-gray-200 rounded-full shadow-lg flex items-center p-1 gap-1">
            <button onclick="zoomOut()" class="w-8 h-8 rounded-full flex items-center justify-center text-gray-500 hover:bg-gray-100 hover:text-primary transition-colors" title="Thu nhỏ">
                <i class="fa-solid fa-minus"></i>
            </button>
            <span id="zoom-level" class="text-sm font-bold text-primary w-12 text-center select-none">100%</span>
            <button onclick="zoomIn()" class="w-8 h-8 rounded-full flex items-center justify-center text-gray-500 hover:bg-gray-100 hover:text-primary transition-colors" title="Phóng to">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>
    </div>
    <!-- Khung chứa ảnh tự động -->
    <main class="flex-1 w-full max-w-9xl mx-auto px-4 pb-12 select-none" oncontextmenu="return false;">
        <div id="image-container" class="w-full bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col items-center p-2 md:p-8 relative min-h-[500px]">
            <!-- Vòng xoay tải trang -->
            <div id="loader" class="absolute top-20 text-gray-400 flex flex-col items-center gap-2">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl"></i>
                <span class="text-sm">Đang tải dữ liệu ...</span>
            </div>
        </div>
    </main>

    <!-- Script Tự động hóa tải ảnh từ Online -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Lấy thông tin từ thanh địa chỉ URL
            const urlParams = new URLSearchParams(window.location.search);
            const folderName = urlParams.get('folder'); 
            const title = urlParams.get('title'); 

            // Cập nhật tiêu đề trang
            if (title) {
                document.getElementById('doc-title').innerText = title;
                document.title = title + " - DoforMath";
            }

            const container = document.getElementById('image-container');
            const loader = document.getElementById('loader');
            let pageNum = 1;
            
            // ----------------------------------------------------
            // THIẾT LẬP CLOUDINARY
            // Bạn thay "TEN_CLOUD_CUA_BAN" bằng tên thật trên Cloudinary của bạn
            const cloudName = "vrhp60zs"; 
            // ----------------------------------------------------

            // Hàm đệ quy: Tải từng ảnh một từ Cloudinary
            function loadNextImage() {
                if (!folderName) {
                    loader.innerHTML = "Lỗi: Không tìm thấy thư mục tài liệu!";
                    return;
                }

                let img = new Image();
                
                // Móc trực tiếp vào Cloudinary, chèn sẵn f_auto và q_auto để ảnh siêu nét mà cực nhẹ
                img.src = `https://res.cloudinary.com/${cloudName}/image/upload/f_auto,q_auto/${folderName}-${pageNum}.png`;
                img.className = "w-full h-auto block mb-6 shadow-sm border border-gray-100 pointer-events-none";
                img.alt = `Trang ${pageNum}`;

                // Nếu ảnh tồn tại trên mây -> Nhét vào khung và tiếp tục
                img.onload = function() {
                    loader.style.display = 'none'; 
                    container.appendChild(img);
                    pageNum++;
                    loadNextImage();
                };

                // Nếu ảnh không tồn tại (hết ảnh trong bài) -> Dừng lại
                img.onerror = function() {
                    if (pageNum === 1) {
                        loader.innerHTML = "Không tìm thấy tài liệu trên mây. Vui lòng kiểm tra lại Cloudinary.";
                    }
                };
            }

            // Bắt đầu chạy
            loadNextImage();
        });
    </script>
    
    <!-- Script Kích hoạt KaTeX cho Logo -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            renderMathInElement(document.body, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false}
                ],
                throwOnError : false
            });
        });
    </script>
    <!-- Script Xử lý chức năng Zoom -->
    <script>
        // Mức zoom mặc định ban đầu là 100%
        let currentZoom = 100;

        function zoomIn() {
            // Giới hạn phóng to tối đa là 150% để ảnh không bị vỡ hoặc tràn quá mức
            if (currentZoom < 150) { 
                currentZoom += 10;
                applyZoom();
            }
        }

        function zoomOut() {
            // Giới hạn thu nhỏ tối thiểu là 50%
            if (currentZoom > 50) { 
                currentZoom -= 10;
                applyZoom();
            }
        }

        function applyZoom() {
            // 1. Cập nhật con số hiển thị trên thanh công cụ
            document.getElementById('zoom-level').innerText = currentZoom + '%';
            
            // 2. Điều chỉnh chiều rộng của khung chứa ảnh
            const container = document.getElementById('image-container');
            container.style.width = currentZoom + '%';
            
            // 3. Đảm bảo khung chứa luôn được căn giữa màn hình dù to hay nhỏ
            container.style.margin = '0 auto';
        }
    </script>

</body>
</html>
