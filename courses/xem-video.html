<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xem Video - DoforMath</title>
    
    <link rel="icon" type="image/png" href="../assets/images/Doformath.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Cấu hình màu sắc chủ đạo là Teal (Mã #0d9488) -->
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { primary: '#0d9488'} } }
        }
    </script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- KaTeX cho Logo Toán học -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 antialiased font-sans min-h-screen flex flex-col">

    <!-- Header đồng bộ tông sáng -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <button onclick="window.close()" class="flex items-center text-gray-500 hover:text-primary font-medium gap-2 transition-colors">
                <i class="fa-solid fa-arrow-left"></i> Đóng tab
            </button>
            <div class="hidden sm:block text-2xl tracking-tight text-gray-900 pb-1 cursor-default">
                $\textsf{\textbf{Dofor}}\textcolor{#0d9488}{\displaystyle\sum}\textsf{\textbf{ath}}$
            </div>
        </div>
    </header>

    <!-- Khối Banner Tiêu đề Tông Sáng - Xanh Teal -->
    <div class="max-w-4xl mx-auto px-4 w-full mt-8 mb-6">
        <div class="bg-gradient-to-r from-teal-50 to-white border border-teal-100 rounded-2xl p-6 shadow-sm flex flex-col items-center text-center">
            
            <span class="bg-white text-teal-600 border border-teal-200 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wide mb-3 inline-flex items-center gap-1.5 shadow-sm">
                <i class="fa-brands fa-youtube"></i> Video Bài giảng
            </span>
            
            <h1 id="video-title" class="text-2xl md:text-3xl font-bold text-gray-900 leading-snug">Đang tải tên bài học...</h1>
            
            <div class="w-16 h-1 bg-gradient-to-r from-teal-400 to-teal-600 rounded-full mt-4"></div>
        </div>
    </div>

    <!-- Khung hiển thị Video Tỷ lệ 16:9 chuẩn -->
    <main class="flex-1 w-full max-w-4xl mx-auto px-4 pb-12">
        <!-- Vẫn giữ nền đen cho khu vực nhúng video để video không bị chói -->
        <div class="w-full bg-black rounded-xl shadow-lg overflow-hidden relative aspect-video border border-gray-200">
            <iframe id="youtube-player" class="absolute top-0 left-0 w-full h-full" src="" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </main>

    <!-- Script điều khiển tự động -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            renderMathInElement(document.body, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false}
                ],
                throwOnError : false
            });

            const urlParams = new URLSearchParams(window.location.search);
            const videoId = urlParams.get('id');
            const title = urlParams.get('title');

            if (title) {
                document.getElementById('video-title').innerText = title;
                document.title = title + " - DoforMath";
            }

            if (videoId) {
                const embedUrl = `https://www.youtube.com/embed/${videoId}?rel=0&modestbranding=1`;
                document.getElementById('youtube-player').src = embedUrl;
            } else {
                document.getElementById('video-title').innerText = "Lỗi: Không tìm thấy Video ID!";
            }
        });
    </script>
</body>
</html>
